name: Build Minecraft Armbat keyboard test

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Get exact Armbat v0.1.3 source
        run: git clone --branch v0.1.3 --depth 1 --recurse-submodules https://github.com/dima-xd/armbat.git src - name: Apply Minecraft keyboard patch
        working-directory: src
        run: |
          echo "" | base64 -d > /tmp/mcpe.patch
          git apply --check /tmp/mcpe.patch
          git apply /tmp/mcpe.patch

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install matching SDK NDK CMake
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Assemble TEST APK (separate from original Armbat)
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: armbat-mcpe-keyboard-test
          path: src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
